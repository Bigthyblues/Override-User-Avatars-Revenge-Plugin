name: Build and deploy Revenge plugin (gh-pages branch)
run-name: Publish Revenge plugin from ${{ github.sha }}

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Identify deployment workflow
        run: |
          echo "Workflow revision: gh-pages-branch-v2"
          echo "Commit: $GITHUB_SHA"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build plugin
        run: pnpm build

      - name: Verify Revenge artifacts
        run: pnpm verify

      - name: Add site documentation
        run: |
          cp README.md dist/README.md
          touch dist/.nojekyll

      # Do not call the Pages REST API here. GITHUB_TOKEN cannot create a Pages
      # site in repositories where Pages has not already been enabled, which
      # causes "Resource not accessible by integration". Publishing a branch
      # only needs contents:write and works before the one-time Pages setting.
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Show Revenge import URL
        run: |
          echo "## Revenge plugin deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Published the verified files to the \`gh-pages\` branch." >> "$GITHUB_STEP_SUMMARY"
          echo "After selecting **Deploy from a branch / gh-pages / root** in repository Settings → Pages, import:" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "https://bigthyblues.github.io/Override-User-Avatars-Revenge-Plugin/Override-User-Avatars/" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
